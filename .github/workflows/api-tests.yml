name: API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'docker'
        type: choice
        options:
          - local
          - docker
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Compose
        run: |
          docker compose --version
      
      - name: Start services with Docker Compose
        run: |
          docker compose up -d
          # Wait for services to be ready
          echo "Waiting for services to be ready..."
          sleep 30
          
          # Check container status
          echo "=== Container Status ==="
          docker compose ps
          
          # Show logs for debugging
          echo "=== Monolith logs ==="
          docker compose logs monolith | tail -20
          echo "=== Movies service logs ==="
          docker compose logs movies-service | tail -20
          echo "=== Events service logs ==="
          docker compose logs events-service | tail -20
          echo "=== Proxy service logs ==="
          docker compose logs proxy-service | tail -20
          
          # Check if containers are running
          echo "=== Checking if containers are running ==="
          if docker compose ps | grep -q "Exit"; then
            echo "Some containers have exited. Showing detailed logs:"
            docker compose ps
            echo "=== Full Monolith logs ==="
            docker compose logs monolith
            echo "=== Full Movies service logs ==="
            docker compose logs movies-service
            echo "=== Full Events service logs ==="
            docker compose logs events-service
            echo "=== Full Proxy service logs ==="
            docker compose logs proxy-service
            exit 1
          fi
          
          # Wait for services to be ready
          echo "Waiting for services to be ready..."
          sleep 60
          
          # Final status check
          echo "=== Final Container Status ==="
          docker compose ps
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: tests/postman/package-lock.json
      
      - name: Install Newman and dependencies
        working-directory: tests/postman
        run: npm install
      
      - name: Run API tests
        working-directory: tests/postman
        run: npm test
        
      
      - name: Stop services
        if: always()
        run: docker compose down